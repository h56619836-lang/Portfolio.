<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech Stack Portfolio</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050b16;
color:white;
padding:40px;
}

.container{
max-width:1200px;
margin:auto;
}

.title{
font-size:40px;
margin-bottom:40px;
font-weight:bold;
}

.section{
margin-bottom:50px;
}

.section h2{
margin-bottom:20px;
font-size:28px;
color:#ffffff;
}

.stack{
display:flex;
flex-wrap:wrap;
gap:15px;
}

.tag{
padding:14px 28px;
border-radius:10px;
font-size:18px;
font-weight:bold;
color:white;
transition:0.3s;
cursor:pointer;
}

.tag:hover{
transform:scale(1.08);
}

.react{
background:#00d8ff;
color:black;
}

.js{
background:#ffe600;
color:black;
}

.ts{
background:#0099ff;
}

.vue{
background:#1abc9c;
}

.next{
background:#000000;
border:1px solid white;
}

.html{
background:#ff5e00;
}

.css{
background:#0077ff;
}

.sass{
background:#ff4fa0;
}

.tailwind{
background:#00ffd5;
color:black;
}

.bootstrap{
background:#8e44ad;
}

.node{
background:#32cd32;
}

.express{
background:#555;
}

.mongodb{
background:#00ff66;
color:black;
}

.firebase{
background:#4db8ff;
}

.django{
background:#006400;
}

.python{
background:#3399ff;
}

.mobile{
background:#222;
}

.footer{
margin-top:60px;
text-align:center;
color:#aaa;
font-size:18px;
}

@media(max-width:700px){

.title{
font-size:30px;
}

.tag{
font-size:15px;
padding:10px 18px;
}

}

</style>
</head>

<body>

<div class="container">

<h1 class="title">⚡ Tech Stack Portfolio</h1>

<div class="section">

<h2>Frontend</h2>

<div class="stack">

<div class="tag react">React</div>
<div class="tag js">JavaScript</div>
<div class="tag ts">TypeScript</div>
<div class="tag vue">Vue JS</div>
<div class="tag next">Next JS</div>

</div>
</div>

<div class="section">

<h2>Styling</h2>

<div class="stack">

<div class="tag html">HTML5</div>
<div class="tag css">CSS3</div>
<div class="tag sass">SASS</div>
<div class="tag tailwind">Tailwind CSS</div>
<div class="tag bootstrap">Bootstrap</div>

</div>
</div>

<div class="section">

<h2>Backend</h2>

<div class="stack">

<div class="tag node">Node JS</div>
<div class="tag express">Express JS</div>
<div class="tag mongodb">MongoDB</div>
<div class="tag firebase">Firebase</div>
<div class="tag django">Django</div>
<div class="tag python">Python</div>

</div>
</div>

<div class="section">

<h2>Mobile</h2>

<div class="stack">

<div class="tag mobile">React Native</div>

</div>
</div>

<div class="footer">
Created by Hasanboy Komilov
</div>

</div>

</body>
</html>
